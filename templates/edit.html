<!DOCTYPE html>
<html>

<head>
    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

<h2>Edit Expense</h2>

<form method="POST">

    <input
    class="form-control mb-2"
    name="title"
    value="{{ expense.title }}"
    required>

    <input
    class="form-control mb-2"
    type="number"
    step="0.01"
    name="amount"
    value="{{ expense.amount }}"
    required>

    <select
    class="form-control mb-2"
    name="category">

        <option {% if expense.category=="Food" %}selected{% endif %}>Food</option>
        <option {% if expense.category=="Transport" %}selected{% endif %}>Transport</option>
        <option {% if expense.category=="Shopping" %}selected{% endif %}>Shopping</option>
        <option {% if expense.category=="Bills" %}selected{% endif %}>Bills</option>
        <option {% if expense.category=="Entertainment" %}selected{% endif %}>Entertainment</option>
        <option {% if expense.category=="Other" %}selected{% endif %}>Other</option>

    </select>

    <input
    class="form-control mb-2"
    type="date"
    name="date"
    value="{{ expense.date }}"
    required>

    <textarea
    class="form-control mb-2"
    name="note">{{ expense.note }}</textarea>

    <button class="btn btn-success">
        Update Expense
    </button>

</form>

</body>
</html>
